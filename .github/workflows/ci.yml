name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/DevOpsWatcher.WinForms -c Release

      - name: Publish single-file exe
        run: dotnet publish src/DevOpsWatcher.WinForms -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DevOpsWatcher-${{ github.sha }}
          path: publish/DevOpsWatcher.exe
